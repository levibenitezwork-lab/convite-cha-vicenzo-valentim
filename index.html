<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#626c52"><meta name="description" content="Convite para o chá de bebê de Vicenzo e Valentim."><title>Chá de bebê · Vicenzo e Valentim</title><link rel="preload" href="./images/capa.webp" as="image"><link rel="stylesheet" href="./style.css"></head>
